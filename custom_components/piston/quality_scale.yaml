# Self-assessment against the Home Assistant integration quality scale.
# Checked 2026-11-02 against https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/
# (54 rules: 20 bronze, 10 silver, 21 gold, 3 platinum). The list drifts: re-read the page, update RULES in
# tests/test_quality_scale.py and this file together. manifest.json declares the tier reached; a test enforces that
# no rule at or below the declared tier is todo.
rules:
  # --- Bronze
  action-setup:
    status: exempt
    comment: The integration only has entity actions (show_toast, show_pip, hide_pip), which the platforms register.
  appropriate-polling:
    status: exempt
    comment: Local push. The device sends its state over the open websocket and nothing is polled.
  brands:
    status: done
    comment: The icon ships in the integration folder (brand/icon.png).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: There are no third-party requirements. The protocol code is part of the repository.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers of its own. The Toast click event entity is documented under What you get.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: Setup never fails for an unreachable device. A device that is off or asleep is a normal state and the media player has to exist to wake it, which a ConfigEntryNotReady would prevent. Permanent problems (rejected secret, version mismatch) show as a re-pairing flow or a repair issue with the entities unavailable.
  unique-config-entry: done

  # --- Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Set on every platform. The media player is deliberately 0 so a newer launch can replace a queued one at the device.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 97 percent with tests/ha (pytest-homeassistant-custom-component), see tests/ha/README.md.

  # --- Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One device per config entry. Its sensors and controllers are added as the device reports them.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: todo

  # --- Platinum
  async-dependency:
    status: exempt
    comment: There is no third-party library. The protocol client is asyncio code in this repository.
  inject-websession:
    status: done
    comment: The websocket uses Home Assistant's shared aiohttp session.
  strict-typing: todo
