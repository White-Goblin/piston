name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t .
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit -p . | grep -v node_modules | (! grep .)
  ha-tests:
    # The integration inside a real Home Assistant (tests/ha). Pinned to the Home Assistant release the integration was verified against
    # (tests/ha/requirements.txt); bump that file and the Python version together. Not a prerequisite of the release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/ha/requirements.txt
      - run: pip install -r tests/ha/requirements.txt
      - run: python -m pytest tests/ha -q --cov --cov-config=tests/ha/.coveragerc --cov-fail-under=95
