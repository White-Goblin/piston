name: Tests

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a new Home Assistant release that breaks the integration shows up without a code change.
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t .
  lint:
    # ruff check with the rules in ruff.toml (lint only, no formatter). The version is pinned; bump it deliberately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check .
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit -p . | grep -v node_modules | (! grep .)
      - run: node --test "tests/js/*.test.js"
  ha-tests:
    # The integration inside a real Home Assistant (tests/ha), run against two releases (steps in .github/actions/ha-tests):
    #   pinned: the release in tests/ha/requirements.txt, the one the integration was verified against (the floor). Bump it deliberately,
    #           together with the Python version.
    #   latest: the newest Home Assistant release, resolved fresh on every run (so it bumps itself). Here it does not block a merge: a
    #           failure is an early warning that an upgrade needs work. The release workflow runs both and requires both to pass.
    name: ha-tests (${{ matrix.ha }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ha == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ha-tests
        with:
          ha: ${{ matrix.ha }}
