name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag, the manifest, package.json and the changelog agree
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: HACS validation and Hassfest passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The HACS default list wants a release created after both checks pass. Re-run this workflow once they are green.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --json workflowName,conclusion,event --limit 50)
          for name in "HACS validation" "Hassfest"; do
            ok=$(echo "$runs" | jq --arg n "$name" '[.[] | select(.workflowName == $n and .event == "push" and .conclusion == "success")] | length')
            if [ "$ok" -lt 1 ]; then echo "::error::$name has no successful run on $GITHUB_SHA"; exit 1; fi
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: python -m unittest discover -s tests -t .
      - run: node --test "tests/js/*.test.js"
      - run: python scripts/package_plugin.py out
      - name: Create the release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is the CHANGELOG section (Home Assistant shows it in the update entity), plus the generated compare link
          python scripts/release_notes.py "$GITHUB_REF_NAME" > out/NOTES.md
          gh release create "$GITHUB_REF_NAME" out/*.zip out/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file out/NOTES.md --generate-notes
